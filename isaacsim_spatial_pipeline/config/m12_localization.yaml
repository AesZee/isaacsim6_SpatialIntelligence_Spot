runtime:
  isaac_python: /home/aes/isaacsim/python.sh
  entry_point: /home/aes/isaac_ws/isaacsim_spatial_pipeline/scripts/10_run_sim.py
  world_usd: /home/aes/isaac_ws/scenes/Warehouse.usd
  ros_setup: /opt/ros/jazzy/setup.bash
  ros_domain_id: 0
  headless: true
  require_gpu: true
artifacts:
  output_root: /home/aes/isaac_ws/isaacsim_spatial_pipeline/artifacts/m12_localization
safety:
  overwrite_existing_outputs: false
  source_usd_writes: false
  package_installation: false
  sudo: false
limits:
  max_experiments: 3
  total_duration_sec: 600.0
  startup_timeout_sec: 180.0
  topic_timeout_sec: 30.0
  trajectory_timeout_sec: 120.0
  shutdown_timeout_sec: 15.0
  watchdog_window_sec: 4.0
  output_max_mb: 1000.0
trajectory:
  data_file: /home/aes/isaac_ws/isaacsim_spatial_pipeline/config/trajectories.json
  name: short_smoke
slam:
  launch_file: /home/aes/isaac_ws/isaacsim_spatial_pipeline/launch/m09_map_quality_experiment.launch.py
  profile_config: /home/aes/isaac_ws/isaacsim_spatial_pipeline/config/m09_lidar_slice_profiles.yaml
evaluation:
  diagnostic_duration_sec: 8.0
  localization_duration_sec: 8.0
  localization_expected_transform: [11.901680507861036, 7.698126707447676, -0.22333550889745574]
  map_save_duration_sec: 10.0
  min_known_ratio: 0.10
  min_occupied_cells: 500
  immutable_inputs:
    - /home/aes/isaac_ws/isaacsim_spatial_pipeline/artifacts/m12_mapping/run_20260725T162421_157320_5c77b261/experiment_1_localization_map/posegraph/map.posegraph
    - /home/aes/isaac_ws/isaacsim_spatial_pipeline/artifacts/m12_mapping/run_20260725T162421_157320_5c77b261/experiment_1_localization_map/posegraph/map.data
bag:
  enabled: false
  topics: [/clock, /tf, /tf_static, /spot/lidar/points, /scan, /odom, /map]
experiments:
  - name: original_pose
    profile: wide_diagnostic
    initial_pose_offset: [0.0, 0.0, 0.0]
    launch_arguments: &localization
      slam_executable: localization_slam_toolbox_node
      slam_params_file: /home/aes/isaac_ws/isaacsim_spatial_pipeline/config/m12_slam_toolbox_localization.yaml
      map_file_name: /home/aes/isaac_ws/isaacsim_spatial_pipeline/artifacts/m12_mapping/run_20260725T162421_157320_5c77b261/experiment_1_localization_map/posegraph/map
      map_start_pose: "0.0,0.0,0.0"
  - name: east_offset
    profile: wide_diagnostic
    initial_pose_offset: [0.5, 0.0, 0.0]
    launch_arguments:
      <<: *localization
      map_start_pose: "0.5,0.0,0.0"
  - name: recovery_offset
    profile: wide_diagnostic
    initial_pose_offset: [0.0, 0.5, 0.35]
    launch_arguments:
      <<: *localization
      map_start_pose: "0.25,0.25,0.15"
